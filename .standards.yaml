---
version: 1
repository:
  owner: lusoris
  name: lusoris
  visibility: ""
  description: ""
  homepage: ""
  topics: []
# README.md is the public profile page of the account; adoption leaves it as written and adds no governance block
# (answer engine-adoption-lusoris-profile-readme-20261023).
adoption:
  decline:
    - readme
profiles:
  - template-seed
facets:
  - security:high
  - agent:sandboxed
register:
  sources:
    expected: 13
    sha256:
      sha256:bae7c17912f7d873769ddeae9dce1cf267e94eedd838228a219463bf5cb35efa
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  - rule: HISS-11
    path: .github/workflows/release.yml
    reason: adoption found the release workflows short of the declared supply chain (SLSA Build Level 3 declared, Level 0 measured; enforce_cosign without a cosign signing step; require_sbom without an SBOM step); raise them as docs/guides/releasing.md in Praetor describes, then remove this entry
    expires: "2027-01-21"
  - rule: declared-linters
    tool: gitleaks
    reason: adoption scaffolds no CI job for gitleaks declared by facet "security:high"; run it in a workflow, or remove this entry
    expires: "2027-01-21"
  - rule: declared-linters
    tool: semgrep
    reason: adoption scaffolds no CI job for semgrep declared by profile "template-seed", facet "agent:sandboxed"; run it in a workflow, or remove this entry
    expires: "2027-01-21"
  - rule: declared-linters
    tool: trivy
    reason: adoption scaffolds no CI job for trivy declared by facet "security:high"; run it in a workflow, or remove this entry
    expires: "2027-01-21"
overrides:
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    # Solo-maintained repository (standing policy of 2026-10-09, answer
    # engine-profile-repo-push-policy-20261023): one maintainer, so no approval
    # gate; the required count is kept for a later independent review mode.
    review_mode: single_maintainer
    dismiss_stale_reviews: true
